[project]
name = "llm-client"
dynamic = ["version"]
description = "LLM 多后端客户端（Ollama / llama.cpp），支持工具调用、流式输出和智能体循环"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "RUF",    # ruff-specific rules
]
ignore = [
    "S101",   # assert in tests
    "PLR0913", # too many arguments for agent/backend classes
    "PLR0915", # complex agent loop is expected
    "PLR2004", # magic values in UI
    "S603",   # subprocess intentional
    "S607",   # partial paths
]

[tool.ruff.lint.isort]
known-first-party = ["core", "interfaces", "tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
